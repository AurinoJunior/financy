services:
  postgres:
    image: postgres:17-alpine
    container_name: financy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "financy"
      POSTGRES_PASSWORD: "financy"
      POSTGRES_DB: "financy"
    ports:
      - "5432:5432"
    volumes:
      - financy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financy -d financy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  financy_pgdata:
